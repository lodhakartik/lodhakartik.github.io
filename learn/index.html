<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFF8E7" />
  <title>Learning World &middot; Kartik Lodha</title>
  <meta name="description" content="A unified reading adventure for little learners: pick a buddy, travel the journey map, learn letters, sounds and words, and grow with stars, stickers and levels." />
  <meta name="robots" content="noai, noimageai" />
  <meta name="author" content="Kartik Lodha" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Fredoka:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    /* hub-specific bits */
    .hub-head { max-width: 640px; margin: 0 auto; width: 100%; padding: 0 16px; }
    .buddy-row { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.6);
      border: 3px solid var(--gold); border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow-soft); }
    .buddy { font-size: 56px; line-height: 1; position: relative; }
    .buddy .crown { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 26px; }
    .buddy-info { flex: 1; min-width: 0; }
    .buddy-name { font-family: "Caveat", cursive; font-weight: 700; font-size: 26px; color: var(--maroon); margin: 0 0 4px; }
    .counts { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }

    .path { max-width: 560px; margin: 18px auto 0; width: 100%; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
    .node { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.6);
      border: 3px solid var(--gold); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow-soft); }
    .node .n-emoji { font-size: 40px; line-height: 1; flex: 0 0 auto; }
    .node .n-body { flex: 1; min-width: 0; }
    .node .n-title { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 21px; color: var(--maroon); margin: 0; }
    .node .n-skill { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--gold-deep);
      background: rgba(255,248,225,0.8); border: 1.5px solid var(--gold); border-radius: 999px; padding: 2px 10px; }
    .node.soon { opacity: 0.6; }
    .node .n-go { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; color: #FFF8E7;
      background: var(--maroon); border: none; border-radius: 999px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
    .node .n-go.soon { background: var(--parchment-dark); color: var(--ink-soft); pointer-events: none; }
    .node .n-go.link { background: var(--gold); color: var(--ink); }

    .buddy-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 360px; margin: 14px auto; }
    .buddy-opt { font-size: 44px; background: rgba(255,255,255,0.6); border: 3px solid var(--gold); border-radius: 18px;
      aspect-ratio: 1/1; cursor: pointer; transition: transform 120ms ease, border-color 120ms ease, background 120ms ease; }
    .buddy-opt.sel { border-color: var(--maroon); background: var(--green-soft); transform: scale(1.05); }
    .name-in { font-family: "Fredoka", sans-serif; font-size: 22px; text-align: center; padding: 12px 16px;
      border: 3px solid var(--gold); border-radius: 16px; width: 100%; max-width: 320px; margin: 6px auto; display: block; background: rgba(255,255,255,0.7); color: var(--ink); }

    .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; max-width: 480px; margin: 12px auto; }
    .sticker { font-size: 34px; background: rgba(255,255,255,0.6); border: 2px solid var(--gold); border-radius: 14px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
    .sticker.empty { color: var(--parchment-dark); font-size: 24px; }

    .profile-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.6); border: 2px solid var(--gold);
      border-radius: 16px; padding: 10px 14px; max-width: 420px; margin: 8px auto; }
    .profile-row .pr-emoji { font-size: 34px; } .profile-row .pr-name { flex: 1; font-weight: 600; font-size: 18px; color: var(--maroon); }
    .code-box { width: 100%; max-width: 460px; height: 90px; margin: 8px auto; display: block; border: 2px solid var(--gold);
      border-radius: 12px; padding: 10px; font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.8); color: var(--ink); }
    .center { text-align: center; }
    .link-btn { background: none; border: none; color: var(--gold-deep); text-decoration: underline; cursor: pointer; font-size: 14px; margin: 6px; font-family: "Fredoka", sans-serif; }
  </style>
</head>
<body>
  <div class="lw-top">
    <a class="lw-pill" href="../index.html">&#x2190; Home</a>
    <h1 class="lw-title">Learning World</h1>
    <span class="lw-pill" id="btn-switch" style="visibility:hidden">&#x1F464; Switch</span>
  </div>

  <div id="app" class="lw-stage"></div>
  <footer>&#xA9; Kartik Lodha &middot; a reading adventure for little learners</footer>

  <script src="./engine.js"></script>
  <script src="./content.js"></script>
  <script>
  (function () {
    "use strict";
    var app = document.getElementById("app");
    var btnSwitch = document.getElementById("btn-switch");
    var BUDDIES = ["🐣","🐱","🐶","🦉","🐲","🐰","🦁","🐼"];
    var STICKERS = ["🌈","🚀","🦋","🌻","🍭","🐢","🎈","🏆","🌟","🦄","🍩","⚡","🌙","🐬","🎨","🧸","🌸","🍀"];

    var NODES = [
      { id:"letters",      title:"Alphabet",         emoji:"🔤", skill:"Reading",    kind:"link", url:"../games/alphabet-tap/" },
      { id:"sounds",       title:"Sound Play",       emoji:"🔊", skill:"Listening",  kind:"quiz", quiz:"letterSound" },
      { id:"lettersounds", title:"Letters & Sounds", emoji:"📣", skill:"Phonics",    kind:"link", url:"../games/letters-sounds/" },
      { id:"firstletter",  title:"First Letter",     emoji:"🅰️", skill:"Reading",    kind:"quiz", quiz:"firstLetter" },
      { id:"buildwords",   title:"Build Words",      emoji:"🧩", skill:"Writing",    kind:"link", url:"../games/word-builder/" },
      { id:"wordlinks",    title:"Word Links",       emoji:"🔗", skill:"Vocabulary", kind:"link", url:"../games/word-association/" },
      { id:"readwords",    title:"Read Words",       emoji:"📖", skill:"Reading",    kind:"quiz", quiz:"pictureWord" },
      { id:"speaking",     title:"Speaking",         emoji:"🗣️", skill:"Speaking",   kind:"soon" },
      { id:"writing",      title:"Writing Pro",      emoji:"✍️", skill:"Writing",    kind:"soon" }
    ];

    /* ---------- native quiz builders (use shared engine + content) ---------- */
    var C = window.LWC;
    function buildLetterSound(L, n) {
      var d = C.BY_L[L];
      var distract = LW.pickN(C.LETTERS.filter(function (x) { return x.L !== L; }), n - 1).map(function (x) { return x.L; });
      return {
        prompt: "Which letter makes this sound?",
        stim: '<div class="stim-emoji">🔊</div>',
        sayStart: function () { LW.say(d.s + " ... " + d.key, 0.8); },
        choices: LW.shuffle([L].concat(distract)).map(function (k) { return { key:k, cls:"ltr", html:k }; }),
        correct: L,
        winSay: function () { LW.say("Yes! " + d.s + " ... " + d.key + "!", 0.82); },
        fixSay: function () { LW.say("This one. " + d.s + " ... " + d.key + ".", 0.8); }
      };
    }
    function buildFirstLetter(w, n) {
      var d = C.BY_W[w];
      var pool = C.LETTERS.map(function (x) { return x.L; }).filter(function (L) { return L !== d.L; });
      return {
        prompt: "What letter does it start with?",
        stim: '<div class="stim-emoji">' + d.e + '</div><div class="stim-word">' + d.w + '</div>',
        sayStart: function () { LW.say(d.w + " ... what letter does it start with?", 0.85); },
        choices: LW.shuffle([d.L].concat(LW.pickN(pool, n - 1))).map(function (k) { return { key:k, cls:"ltr", html:k }; }),
        correct: d.L,
        winSay: function () { LW.say("Yes! " + d.w + " starts with " + d.L + ".", 0.82); },
        fixSay: function () { LW.say(d.w + " starts with " + d.L + ".", 0.8); }
      };
    }
    function buildPictureWord(w, n) {
      var d = C.BY_W[w];
      var distract = LW.pickN(C.WORDS.filter(function (x) { return x.w !== w; }), n - 1);
      return {
        prompt: "Which word matches the picture?",
        stim: '<div class="stim-emoji">' + d.e + '</div>',
        sayStart: function () { LW.say("Which word is this? " + d.w + ".", 0.85); },
        choices: LW.shuffle([d].concat(distract)).map(function (x) { return { key:x.w, cls:"wrd", html:x.w }; }),
        correct: w,
        winSay: function () { LW.say("Yes! " + d.w + "!", 0.82); },
        fixSay: function () { LW.say("This word is " + d.w + ".", 0.8); }
      };
    }
    var QUIZ = {
      letterSound: { items: function () { return C.LETTERS.map(function (d) { return d.L; }); }, build: buildLetterSound },
      firstLetter: { items: function () { return C.WORDS.map(function (d) { return d.w; }); }, build: buildFirstLetter },
      pictureWord: { items: function () { return C.WORDS.map(function (d) { return d.w; }); }, build: buildPictureWord }
    };

    /* ---------- views ---------- */
    function petHTML(p, big) {
      var stage = LW.petStage(LW.levelInfo(p.xp).level);
      var crown = stage >= 2 ? '<span class="crown">👑</span>' : (stage >= 1 ? '<span class="crown">✨</span>' : "");
      return '<div class="buddy" style="' + (big ? "font-size:72px" : "") + '">' + p.pet + crown + '</div>';
    }

    function renderGate() {
      btnSwitch.style.visibility = "hidden";
      var existing = LW.Store.list();
      var html = '<p class="prompt center">Welcome! Who is playing today?</p>';
      if (existing.length) {
        existing.forEach(function (p) {
          html += '<div class="profile-row" data-id="' + p.id + '" role="button">' +
                    '<span class="pr-emoji">' + p.pet + '</span>' +
                    '<span class="pr-name">' + p.name + '</span>' +
                    '<span class="lvl-chip">Lvl ' + LW.levelInfo(p.xp).level + '</span>' +
                  '</div>';
        });
        html += '<div class="center" style="margin-top:14px"><button class="btn soft" id="new-p">+ New player</button></div>';
        html += '<div class="center"><button class="link-btn" id="restore">Restore from backup code</button></div>';
      } else {
        html += createFormHTML();
      }
      app.innerHTML = html;
      app.querySelectorAll(".profile-row").forEach(function (row) {
        row.onclick = function () { LW.Store.setCurrent(row.getAttribute("data-id")); renderMap(); };
      });
      if (app.querySelector("#new-p")) app.querySelector("#new-p").onclick = renderCreate;
      if (app.querySelector("#restore")) app.querySelector("#restore").onclick = renderRestore;
      if (app.querySelector("#do-create")) wireCreate();
    }

    function createFormHTML() {
      var opts = BUDDIES.map(function (b) { return '<button class="buddy-opt" data-b="' + b + '">' + b + '</button>'; }).join("");
      return '<p class="prompt center">Pick your buddy</p>' +
             '<div class="buddy-pick" id="buddies">' + opts + '</div>' +
             '<input class="name-in" id="pname" maxlength="14" placeholder="Your name" />' +
             '<div class="center" style="margin-top:10px"><button class="btn big" id="do-create">Start! 🎉</button></div>';
    }
    function renderCreate() { btnSwitch.style.visibility = "hidden"; app.innerHTML = createFormHTML(); wireCreate(); }
    var pickedBuddy = BUDDIES[0];
    function wireCreate() {
      pickedBuddy = BUDDIES[0];
      var bs = app.querySelectorAll(".buddy-opt");
      bs.forEach(function (b) { b.onclick = function () {
        bs.forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); pickedBuddy = b.getAttribute("data-b");
      }; });
      bs[0].classList.add("sel");
      app.querySelector("#do-create").onclick = function () {
        var name = (app.querySelector("#pname").value || "").trim() || "Friend";
        LW.Store.createProfile(name, pickedBuddy);
        LW.fanfare(); LW.confetti(24); renderMap();
      };
    }

    function renderRestore() {
      app.innerHTML = '<p class="prompt center">Paste your backup code</p>' +
        '<textarea class="code-box" id="rin" placeholder="paste code here"></textarea>' +
        '<div class="center"><button class="btn" id="do-restore">Restore</button> ' +
        '<button class="btn ghost" id="cancel-r">Cancel</button></div>';
      app.querySelector("#do-restore").onclick = function () {
        if (LW.Store.importCode(app.querySelector("#rin").value)) { renderGate(); }
        else { alert("Sorry, that code didn't work."); }
      };
      app.querySelector("#cancel-r").onclick = renderGate;
    }

    function renderMap() {
      var p = LW.Store.current();
      if (!p) { renderGate(); return; }
      btnSwitch.style.visibility = "visible";
      var li = LW.levelInfo(p.xp);
      var head =
        '<div class="hub-head"><div class="buddy-row">' +
          petHTML(p, false) +
          '<div class="buddy-info">' +
            '<p class="buddy-name">' + p.name + '</p>' +
            '<div class="xp-wrap"><span class="lvl-chip">Lvl ' + li.level + '</span>' +
              '<div class="xp-bar"><div class="xp-fill" style="width:' + li.pct + '%"></div></div></div>' +
            '<div class="counts">⭐ ' + p.stars + ' stars &middot; 🎟️ ' + p.stickers.length + ' stickers</div>' +
          '</div>' +
          '<button class="n-go link" id="rewards-btn">🎁</button>' +
        '</div></div>';
      var nodes = '<div class="path">';
      NODES.forEach(function (nd) {
        if (nd.kind === "soon") {
          nodes += node(nd, '<button class="n-go soon">Soon</button>');
        } else if (nd.kind === "link") {
          nodes += node(nd, '<button class="n-go link" data-link="' + nd.url + '">Play ↗</button>');
        } else {
          nodes += node(nd, '<button class="n-go" data-quiz="' + nd.id + '">Play →</button>');
        }
      });
      nodes += '</div>';
      nodes += '<div class="center" style="margin-top:18px"><button class="link-btn" id="settings-btn">Settings &amp; backup</button></div>';
      app.innerHTML = head + nodes;

      app.querySelector("#rewards-btn").onclick = renderRewards;
      app.querySelector("#settings-btn").onclick = renderSettings;
      app.querySelectorAll("[data-link]").forEach(function (b) {
        b.onclick = function () { window.open(b.getAttribute("data-link"), "_blank"); };
      });
      app.querySelectorAll("[data-quiz]").forEach(function (b) {
        b.onclick = function () { renderPlay(b.getAttribute("data-quiz")); };
      });
    }
    function node(nd, goHTML) {
      return '<div class="node' + (nd.kind === "soon" ? " soon" : "") + '">' +
               '<span class="n-emoji">' + nd.emoji + '</span>' +
               '<div class="n-body"><p class="n-title">' + nd.title + '</p><span class="n-skill">' + nd.skill + '</span></div>' +
               goHTML + '</div>';
    }

    function renderPlay(nodeId) {
      var nd = NODES.filter(function (x) { return x.id === nodeId; })[0];
      var spec = QUIZ[nd.quiz];
      btnSwitch.style.visibility = "hidden";
      LW.runQuiz({
        mount: app,
        items: spec.items(),
        length: 10,
        xpPerCorrect: 4,
        build: spec.build,
        onDone: function (summary) {
          var newSticker = null;
          var p = LW.Store.current();
          var pool = STICKERS.filter(function (s) { return p.stickers.indexOf(s) === -1; });
          if (pool.length) { newSticker = pool[Math.floor(Math.random() * pool.length)]; LW.addSticker(newSticker); }
          p = LW.Store.current();
          LW.fanfare(); LW.confetti(28);
          var li = LW.levelInfo(p.xp);
          app.innerHTML =
            '<div class="overlay"><div class="card">' +
              '<p class="big">' + p.pet + (summary.leveledUp ? "🎉" : "") + '</p>' +
              '<h2>' + (summary.leveledUp ? "Level " + li.level + "!" : "Great job!") + '</h2>' +
              '<p>You got <b>' + summary.correct + '</b> right and earned <b>+' + summary.xp + ' XP</b>.' +
                 (newSticker ? '<br>New sticker: <span style="font-size:34px">' + newSticker + '</span>' : '') + '</p>' +
              '<button class="btn" id="again">Play again</button> ' +
              '<button class="btn ghost" id="back">Back to map</button>' +
            '</div></div>';
          app.querySelector("#again").onclick = function () { renderPlay(nodeId); };
          app.querySelector("#back").onclick = renderMap;
        }
      });
    }

    function renderRewards() {
      var p = LW.Store.current();
      var li = LW.levelInfo(p.xp);
      var owned = p.stickers.slice();
      var cells = "";
      var total = 18;
      for (var i = 0; i < total; i++) {
        cells += owned[i] ? '<div class="sticker">' + owned[i] + '</div>' : '<div class="sticker empty">?</div>';
      }
      app.innerHTML =
        '<div class="center">' + petHTML(p, true) + '</div>' +
        '<p class="prompt center">' + p.name + ' &middot; Level ' + li.level + '</p>' +
        '<p class="center counts">⭐ ' + p.stars + ' stars &middot; 🎟️ ' + owned.length + ' / ' + total + ' stickers</p>' +
        '<div class="sticker-grid">' + cells + '</div>' +
        '<div class="center" style="margin-top:16px"><button class="btn" id="back">← Back to map</button></div>';
      app.querySelector("#back").onclick = renderMap;
    }

    function renderSettings() {
      var p = LW.Store.current();
      app.innerHTML =
        '<p class="prompt center">Settings &amp; backup</p>' +
        '<p class="center counts">Progress is saved on this device. Copy the code below to back up or move to another device.</p>' +
        '<textarea class="code-box" id="code" readonly>' + LW.Store.exportCode() + '</textarea>' +
        '<div class="center"><button class="btn soft" id="copy">Copy backup code</button></div>' +
        '<div class="center" style="margin-top:10px"><button class="btn ghost" id="switch2">👤 Switch / add player</button></div>' +
        '<div class="center" style="margin-top:18px">' +
          '<button class="link-btn" id="del">Delete this player (' + p.name + ')</button></div>' +
        '<div class="center" style="margin-top:8px"><button class="btn" id="back">← Back to map</button></div>';
      app.querySelector("#copy").onclick = function () {
        var t = app.querySelector("#code"); t.select();
        try { document.execCommand("copy"); this.textContent = "Copied!"; } catch (e) {}
      };
      app.querySelector("#switch2").onclick = renderGate;
      app.querySelector("#back").onclick = renderMap;
      app.querySelector("#del").onclick = function () {
        if (confirm("Delete " + p.name + "'s progress? This cannot be undone.")) { LW.Store.remove(p.id); renderGate(); }
      };
    }

    btnSwitch.onclick = renderGate;

    // boot
    if (LW.Store.current()) renderMap(); else renderGate();
  })();
  </script>
</body>
</html>
