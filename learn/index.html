<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFF8E7" />
  <title>Learning World &middot; Kartik Lodha</title>
  <meta name="description" content="A unified reading adventure for little learners: pick a buddy, travel the journey map, learn letters, sounds and words, and grow with stars, stickers and levels." />
  <meta name="robots" content="noai, noimageai" />
  <meta name="author" content="Kartik Lodha" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Fredoka:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="./theme.css" />

  <!-- installable PWA: offline + Add to Home Screen -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Learning World" />
  <style>
    /* hub-specific bits */
    .hub-head { max-width: 640px; margin: 0 auto; width: 100%; padding: 0 16px; }
    .buddy-row { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.6);
      border: 3px solid var(--gold); border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow-soft); }
    .buddy { font-size: 56px; line-height: 1; position: relative; }
    .buddy .crown { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 26px; }
    .buddy-info { flex: 1; min-width: 0; }
    .buddy-name { font-family: "Caveat", cursive; font-weight: 700; font-size: 26px; color: var(--maroon); margin: 0 0 4px; }
    .counts { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }

    .path { max-width: 560px; margin: 18px auto 0; width: 100%; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
    .node { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.6);
      border: 3px solid var(--gold); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow-soft); }
    .node .n-emoji { font-size: 40px; line-height: 1; flex: 0 0 auto; }
    .node .n-body { flex: 1; min-width: 0; }
    .node .n-title { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 21px; color: var(--maroon); margin: 0; }
    .node .n-skill { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--gold-deep);
      background: rgba(255,248,225,0.8); border: 1.5px solid var(--gold); border-radius: 999px; padding: 2px 10px; }
    .node.soon { opacity: 0.6; }
    .node .n-go { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; color: #FFF8E7;
      background: var(--maroon); border: none; border-radius: 999px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
    .node .n-go.soon { background: var(--parchment-dark); color: var(--ink-soft); pointer-events: none; }
    .node .n-go.link { background: var(--gold); color: var(--ink); }

    .buddy-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 360px; margin: 14px auto; }
    .buddy-opt { font-size: 44px; background: rgba(255,255,255,0.6); border: 3px solid var(--gold); border-radius: 18px;
      aspect-ratio: 1/1; cursor: pointer; transition: transform 120ms ease, border-color 120ms ease, background 120ms ease; }
    .buddy-opt.sel { border-color: var(--maroon); background: var(--green-soft); transform: scale(1.05); }
    .name-in { font-family: "Fredoka", sans-serif; font-size: 22px; text-align: center; padding: 12px 16px;
      border: 3px solid var(--gold); border-radius: 16px; width: 100%; max-width: 320px; margin: 6px auto; display: block; background: rgba(255,255,255,0.7); color: var(--ink); }

    .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; max-width: 480px; margin: 12px auto; }
    .sticker { font-size: 34px; background: rgba(255,255,255,0.6); border: 2px solid var(--gold); border-radius: 14px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
    .sticker.empty { color: var(--parchment-dark); font-size: 24px; }

    .profile-row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.6); border: 2px solid var(--gold);
      border-radius: 16px; padding: 10px 14px; max-width: 420px; margin: 8px auto; }
    .profile-row .pr-emoji { font-size: 34px; } .profile-row .pr-name { flex: 1; font-weight: 600; font-size: 18px; color: var(--maroon); }
    .code-box { width: 100%; max-width: 460px; height: 90px; margin: 8px auto; display: block; border: 2px solid var(--gold);
      border-radius: 12px; padding: 10px; font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.8); color: var(--ink); }
    .center { text-align: center; }
    .link-btn { background: none; border: none; color: var(--gold-deep); text-decoration: underline; cursor: pointer; font-size: 14px; margin: 6px; font-family: "Fredoka", sans-serif; }

    /* writing / tracing */
    .stars-row { font-size: 30px; letter-spacing: 4px; text-align: center; margin: 2px 0 6px; min-height: 34px; color: var(--gold); }
    .w-letter { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(30px, 8vw, 44px); color: var(--maroon); text-align: center; margin: 0; cursor: pointer; }
    .w-letter .lower { color: var(--gold-deep); }
    .trace-stack { position: relative; width: min(320px, 82vw); height: min(320px, 82vw); margin: 6px auto 0; }
    .trace-stack canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 20px; touch-action: none; }
    .trace-stack .ghost { background: rgba(255,255,255,0.55); border: 3px dashed var(--gold); }
    .trace-tools { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="lw-top">
    <a class="lw-pill" href="../index.html">&#x2190; Home</a>
    <h1 class="lw-title">Learning World</h1>
    <span class="lw-pill" id="btn-switch" style="visibility:hidden">&#x1F464; Switch</span>
  </div>

  <div id="app" class="lw-stage"></div>
  <footer>&#xA9; Kartik Lodha &middot; a reading adventure for little learners</footer>

  <script src="./engine.js"></script>
  <script src="./content.js"></script>
  <script>
  (function () {
    "use strict";
    var app = document.getElementById("app");
    var btnSwitch = document.getElementById("btn-switch");
    var BUDDIES = ["🐣","🐱","🐶","🦉","🐲","🐰","🦁","🐼"];
    var STICKERS = ["🌈","🚀","🦋","🌻","🍭","🐢","🎈","🏆","🌟","🦄","🍩","⚡","🌙","🐬","🎨","🧸","🌸","🍀"];

    /* ---------- badges (milestones -> "I accomplished it!" feeling) ---------- */
    var BADGES = [
      { id:"start",    icon:"🌱", name:"First Steps",   desc:"Finished an activity",   test:function (p,s) { return roundsTotal(s) >= 1; } },
      { id:"reader",   icon:"📖", name:"Reader",        desc:"3 reading rounds",       test:function (p,s) { return (s.reading  || 0) >= 3; } },
      { id:"listener", icon:"👂", name:"Listener",      desc:"3 sound rounds",         test:function (p,s) { return (s.listening|| 0) >= 3; } },
      { id:"speaker",  icon:"🗣️", name:"Speaker",       desc:"2 speaking rounds",      test:function (p,s) { return (s.speaking || 0) >= 2; } },
      { id:"writer",   icon:"✍️", name:"Writer",        desc:"2 tracing rounds",       test:function (p,s) { return (s.writing  || 0) >= 2; } },
      { id:"wordwiz",  icon:"🧩", name:"Word Wizard",   desc:"3 word rounds",          test:function (p,s) { return (s.vocab    || 0) >= 3; } },
      { id:"numbers",  icon:"🔢", name:"Number Whiz",   desc:"3 number rounds",        test:function (p,s) { return (s.numbers  || 0) >= 3; } },
      { id:"blender",  icon:"🫧", name:"Sound Blender", desc:"2 blending rounds",      test:function (p,s) { return (s.phonics  || 0) >= 2; } },
      { id:"lvl3",     icon:"🥉", name:"Rising Star",   desc:"Reached Level 3",        test:function (p)   { return LW.levelInfo(p.xp).level >= 3; } },
      { id:"lvl5",     icon:"🥈", name:"Super Learner", desc:"Reached Level 5",        test:function (p)   { return LW.levelInfo(p.xp).level >= 5; } },
      { id:"lvl10",    icon:"🥇", name:"Champion",      desc:"Reached Level 10",       test:function (p)   { return LW.levelInfo(p.xp).level >= 10; } },
      { id:"stars25",  icon:"⭐", name:"Star Collector",desc:"Earned 25 stars",        test:function (p)   { return p.stars >= 25; } },
      { id:"stars75",  icon:"🌠", name:"Star Master",   desc:"Earned 75 stars",        test:function (p)   { return p.stars >= 75; } },
      { id:"stick10",  icon:"🎟️", name:"Sticker Star",  desc:"Got 10 stickers",        test:function (p)   { return p.stickers.length >= 10; } },
      { id:"grad",     icon:"🎓", name:"Graduate",      desc:"Reached the top level!", test:function (p)   { return LW.levelInfo(p.xp).level >= LW.MAX_LEVEL; } }
    ];
    var BADGE_BY_ID = {}; BADGES.forEach(function (b) { BADGE_BY_ID[b.id] = b; });
    function roundsTotal(s) { var t = 0; ["reading","listening","speaking","writing","vocab"].forEach(function (k) { t += (s[k] || 0); }); return t; }
    function checkBadges() {
      var p = LW.Store.current(); if (!p) return [];
      var s = LW.stats(), earned = [];
      BADGES.forEach(function (b) { if (p.badges.indexOf(b.id) === -1 && b.test(p, s)) { if (LW.addBadge(b.id)) earned.push(b); } });
      return earned;
    }
    function newBadgeHTML(list) {
      if (!list || !list.length) return "";
      return '<p style="margin:10px 0 2px;font-weight:700;color:var(--maroon)">🎉 New badge!</p><div class="new-badge-row">' +
        list.map(function (b) { return '<span class="nb">' + b.icon + " " + b.name + '</span>'; }).join("") + '</div>';
    }
    function skillKey(skill) { return skill === "Vocabulary" ? "vocab" : skill.toLowerCase(); }

    var NODES = [
      { id:"letters",      title:"Alphabet",         emoji:"🔤", skill:"Reading",    lv:1, kind:"link", url:"../games/alphabet-tap/" },
      { id:"sounds",       title:"Sound Play",       emoji:"🔊", skill:"Listening",  lv:1, kind:"quiz", quiz:"letterSound" },
      { id:"lettersounds", title:"Letters & Sounds", emoji:"📣", skill:"Phonics",    lv:1, kind:"link", url:"../games/letters-sounds/" },
      { id:"counting",     title:"Count It!",        emoji:"🔢", skill:"Numbers",    lv:1, kind:"quiz", quiz:"countBasic" },
      { id:"firstletter",  title:"First Letter",     emoji:"🅰️", skill:"Reading",    lv:2, kind:"quiz", quiz:"firstLetter" },
      { id:"speaking",     title:"Say It!",          emoji:"🗣️", skill:"Speaking",   lv:2, kind:"speak" },
      { id:"writing",      title:"Trace Letters",    emoji:"✍️", skill:"Writing",    lv:3, kind:"write" },
      { id:"buildwords",   title:"Build Words",      emoji:"🧩", skill:"Writing",    lv:3, kind:"link", url:"../games/word-builder/" },
      { id:"readwords",    title:"Read Words",       emoji:"📖", skill:"Reading",    lv:4, kind:"quiz", quiz:"pictureWord" },
      { id:"wordlinks",    title:"Word Links",       emoji:"🔗", skill:"Vocabulary", lv:4, kind:"link", url:"../games/word-association/" },
      { id:"bignum",       title:"Big Numbers",      emoji:"🔟", skill:"Numbers",    lv:5, kind:"quiz", quiz:"countBig" },
      { id:"blend",        title:"Blend It!",        emoji:"🫧", skill:"Phonics",    lv:6, kind:"quiz", quiz:"blend" },
      { id:"sentences",    title:"Read a Sentence",  emoji:"📚", skill:"Reading",    lv:9, kind:"sentence" }
    ];
    var NUM_EMOJI = ["🍎","⭐","🐟","🎈","🍪","🐝","🌸","🚗","🐤","🦋"];
    var CVC = window.LWC.WORDS.filter(function (d) { return d.w.length === 3; }).map(function (d) { return d.w; });
    var SENTENCES = [
      { s:"The cat sat on a mat.", e:"🐱" },
      { s:"A big red bus.",        e:"🚌" },
      { s:"The dog is in the sun.",e:"🐶" },
      { s:"I see a fox and a frog.",e:"🦊" },
      { s:"The pig is in the mud.",e:"🐷" },
      { s:"A bee sat on a bug.",   e:"🐝" }
    ];
    function numRange(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }

    /* ---------- native quiz builders (use shared engine + content) ---------- */
    var C = window.LWC;
    function buildLetterSound(L, n) {
      var d = C.BY_L[L];
      var distract = LW.pickN(C.LETTERS.filter(function (x) { return x.L !== L; }), n - 1).map(function (x) { return x.L; });
      return {
        prompt: "Which letter makes this sound?",
        stim: '<div class="stim-emoji">🔊</div>',
        sayStart: function () { LW.say(d.s + " ... " + d.key, 0.8); },
        choices: LW.shuffle([L].concat(distract)).map(function (k) { return { key:k, cls:"ltr", html:k }; }),
        correct: L,
        winSay: function () { LW.say("Yes! " + d.s + " ... " + d.key + "!", 0.82); },
        fixSay: function () { LW.say("This one. " + d.s + " ... " + d.key + ".", 0.8); }
      };
    }
    function buildFirstLetter(w, n) {
      var d = C.BY_W[w];
      var pool = C.LETTERS.map(function (x) { return x.L; }).filter(function (L) { return L !== d.L; });
      return {
        prompt: "What letter does it start with?",
        stim: '<div class="stim-emoji">' + d.e + '</div><div class="stim-word">' + d.w + '</div>',
        sayStart: function () { LW.say(d.w + " ... what letter does it start with?", 0.85); },
        choices: LW.shuffle([d.L].concat(LW.pickN(pool, n - 1))).map(function (k) { return { key:k, cls:"ltr", html:k }; }),
        correct: d.L,
        winSay: function () { LW.say("Yes! " + d.w + " starts with " + d.L + ".", 0.82); },
        fixSay: function () { LW.say(d.w + " starts with " + d.L + ".", 0.8); }
      };
    }
    function buildPictureWord(w, n) {
      var d = C.BY_W[w];
      var distract = LW.pickN(C.WORDS.filter(function (x) { return x.w !== w; }), n - 1);
      return {
        prompt: "Which word matches the picture?",
        stim: '<div class="stim-emoji">' + d.e + '</div>',
        sayStart: function () { LW.say("Which word is this? " + d.w + ".", 0.85); },
        choices: LW.shuffle([d].concat(distract)).map(function (x) { return { key:x.w, cls:"wrd", html:x.w }; }),
        correct: w,
        winSay: function () { LW.say("Yes! " + d.w + "!", 0.82); },
        fixSay: function () { LW.say("This word is " + d.w + ".", 0.8); }
      };
    }
    function buildCount(num, n, maxN) {
      var emoji = NUM_EMOJI[Math.floor(Math.random() * NUM_EMOJI.length)];
      var group = ""; for (var i = 0; i < num; i++) group += emoji;
      var pool = numRange(1, maxN).filter(function (x) { return x !== num; });
      return {
        prompt: "How many? Count them!",
        stim: '<div class="num-group">' + group + '</div>',
        sayStart: function () { LW.say("How many? Count them.", 0.9); },
        choices: LW.shuffle([num].concat(LW.pickN(pool, n - 1))).map(function (k) { return { key: String(k), cls: "ltr", html: String(k) }; }),
        correct: String(num),
        winSay: function () { LW.say("Yes! " + num + "!", 0.85); },
        fixSay: function () { LW.say("Let's count again. The answer is " + num + ".", 0.85); }
      };
    }
    function sayBlend(word) {
      var parts = word.split("").map(function (L) { return C.SND[L] || L; });
      LW.say(parts.join(", ") + " ... " + word, 0.68);
    }
    function buildBlend(w, n) {
      var d = C.BY_W[w];
      var spelled = w.split("").join(" - ");
      var distract = LW.pickN(CVC.filter(function (x) { return x !== w; }), n - 1).map(function (x) { return C.BY_W[x]; });
      return {
        prompt: "Blend the sounds — which picture?",
        stim: '<div class="stim-letter" style="font-size:clamp(40px,13vw,72px)">' + spelled + '</div>',
        sayStart: function () { sayBlend(w); },
        choices: LW.shuffle([d].concat(distract)).map(function (x) { return { key: x.w, cls: "pic", html: x.e }; }),
        correct: w,
        winSay: function () { LW.say("Yes! " + d.w + "!", 0.85); },
        fixSay: function () { LW.say("This one is " + d.w + ".", 0.82); }
      };
    }
    var QUIZ = {
      letterSound: { items: function () { return C.LETTERS.map(function (d) { return d.L; }); }, build: buildLetterSound },
      firstLetter: { items: function () { return C.WORDS.map(function (d) { return d.w; }); }, build: buildFirstLetter },
      pictureWord: { items: function () { return C.WORDS.map(function (d) { return d.w; }); }, build: buildPictureWord },
      countBasic:  { items: function () { return numRange(1, 10); }, build: function (t, n) { return buildCount(t, n, 10); } },
      countBig:    { items: function () { return numRange(1, 20); }, build: function (t, n) { return buildCount(t, n, 20); } },
      blend:       { items: function () { return CVC.slice(); }, build: buildBlend }
    };

    /* ---------- views ---------- */
    function petHTML(p, big) {
      var stage = LW.petStage(LW.levelInfo(p.xp).level);
      var crown = stage >= 4 ? '<span class="crown">🎓</span>' : (stage >= 2 ? '<span class="crown">👑</span>' : (stage >= 1 ? '<span class="crown">✨</span>' : ""));
      return '<div class="buddy" style="' + (big ? "font-size:72px" : "") + '">' + p.pet + crown + '</div>';
    }

    function renderGate() {
      btnSwitch.style.visibility = "hidden";
      var existing = LW.Store.list();
      var html = '<p class="prompt center">Welcome! Who is playing today?</p>';
      if (existing.length) {
        existing.forEach(function (p) {
          html += '<div class="profile-row" data-id="' + p.id + '" role="button">' +
                    '<span class="pr-emoji">' + p.pet + '</span>' +
                    '<span class="pr-name">' + p.name + '</span>' +
                    '<span class="lvl-chip">Lvl ' + LW.levelInfo(p.xp).level + '</span>' +
                  '</div>';
        });
        html += '<div class="center" style="margin-top:14px"><button class="btn soft" id="new-p">+ New player</button></div>';
        html += '<div class="center"><button class="link-btn" id="restore">Restore from backup code</button></div>';
      } else {
        html += createFormHTML();
      }
      app.innerHTML = html;
      app.querySelectorAll(".profile-row").forEach(function (row) {
        row.onclick = function () { LW.Store.setCurrent(row.getAttribute("data-id")); renderMap(); };
      });
      if (app.querySelector("#new-p")) app.querySelector("#new-p").onclick = renderCreate;
      if (app.querySelector("#restore")) app.querySelector("#restore").onclick = renderRestore;
      if (app.querySelector("#do-create")) wireCreate();
    }

    function createFormHTML() {
      var opts = BUDDIES.map(function (b) { return '<button class="buddy-opt" data-b="' + b + '">' + b + '</button>'; }).join("");
      return '<p class="prompt center">Pick your buddy</p>' +
             '<div class="buddy-pick" id="buddies">' + opts + '</div>' +
             '<input class="name-in" id="pname" maxlength="14" placeholder="Your name" />' +
             '<div class="center" style="margin-top:10px"><button class="btn big" id="do-create">Start! 🎉</button></div>';
    }
    function renderCreate() { btnSwitch.style.visibility = "hidden"; app.innerHTML = createFormHTML(); wireCreate(); }
    var pickedBuddy = BUDDIES[0];
    function wireCreate() {
      pickedBuddy = BUDDIES[0];
      var bs = app.querySelectorAll(".buddy-opt");
      bs.forEach(function (b) { b.onclick = function () {
        bs.forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); pickedBuddy = b.getAttribute("data-b");
      }; });
      bs[0].classList.add("sel");
      app.querySelector("#do-create").onclick = function () {
        var name = (app.querySelector("#pname").value || "").trim() || "Friend";
        LW.Store.createProfile(name, pickedBuddy);
        LW.fanfare(); LW.confetti(24); renderMap();
      };
    }

    function renderRestore() {
      app.innerHTML = '<p class="prompt center">Paste your backup code</p>' +
        '<textarea class="code-box" id="rin" placeholder="paste code here"></textarea>' +
        '<div class="center"><button class="btn" id="do-restore">Restore</button> ' +
        '<button class="btn ghost" id="cancel-r">Cancel</button></div>';
      app.querySelector("#do-restore").onclick = function () {
        if (LW.Store.importCode(app.querySelector("#rin").value)) { renderGate(); }
        else { alert("Sorry, that code didn't work."); }
      };
      app.querySelector("#cancel-r").onclick = renderGate;
    }

    function renderMap() {
      var p = LW.Store.current();
      if (!p) { renderGate(); return; }
      btnSwitch.style.visibility = "visible";
      var li = LW.levelInfo(p.xp);
      var toNext = li.span - li.into;
      var head =
        '<div class="hub-head"><div class="buddy-row">' +
          petHTML(p, false) +
          '<div class="buddy-info">' +
            '<p class="buddy-name">' + p.name + '</p>' +
            '<div class="counts">⭐ ' + p.stars + ' stars &middot; 🎟️ ' + p.stickers.length + ' stickers &middot; 🏅 ' + p.badges.length + ' badges</div>' +
          '</div>' +
          '<button class="n-go link" id="rewards-btn">🎁</button>' +
        '</div>' +
        '<div class="level-panel">' +
          '<div class="lp-top"><span class="lp-lvl">Level ' + li.level + (li.max ? " · MAX" : "") + '</span>' +
            '<span class="lp-xp">' + (li.max ? "🎓 Top level" : (li.into + " / " + li.span + " XP")) + '</span></div>' +
          '<div class="xp-bar big"><div class="xp-fill" style="width:' + li.pct + '%"></div></div>' +
          '<div class="lp-next">' + (li.max
            ? '<span class="grad-banner">🎓 Graduated! Print your certificate 🎉</span>'
            : ('✨ ' + toNext + ' more XP to reach Level ' + (li.level + 1))) + '</div>' +
        '</div></div>';
      var nodes = '<div class="path">';
      NODES.forEach(function (nd) {
        if ((nd.lv || 1) > li.level) {
          nodes += node(nd, '<button class="n-go locked">🔒 Lvl ' + (nd.lv || 1) + '</button>', "locked");
        } else if (nd.kind === "link") {
          nodes += node(nd, '<button class="n-go link" data-link="' + nd.url + '">Play ↗</button>');
        } else if (nd.kind === "write") {
          nodes += node(nd, '<button class="n-go" data-write="1">Play →</button>');
        } else if (nd.kind === "speak") {
          nodes += node(nd, '<button class="n-go" data-speak="1">Play →</button>');
        } else if (nd.kind === "sentence") {
          nodes += node(nd, '<button class="n-go" data-sentence="1">Play →</button>');
        } else {
          nodes += node(nd, '<button class="n-go" data-quiz="' + nd.id + '">Play →</button>');
        }
      });
      nodes += '</div>';
      nodes += '<div class="center" style="margin-top:18px"><button class="link-btn" id="settings-btn">Settings &amp; backup</button></div>';
      app.innerHTML = head + nodes;

      app.querySelector("#rewards-btn").onclick = renderRewards;
      app.querySelector("#settings-btn").onclick = renderSettings;
      app.querySelectorAll("[data-link]").forEach(function (b) {
        b.onclick = function () { window.open(b.getAttribute("data-link"), "_blank"); };
      });
      app.querySelectorAll("[data-quiz]").forEach(function (b) {
        b.onclick = function () { renderPlay(b.getAttribute("data-quiz")); };
      });
      app.querySelectorAll("[data-write]").forEach(function (b) {
        b.onclick = function () { renderWrite(); };
      });
      app.querySelectorAll("[data-speak]").forEach(function (b) {
        b.onclick = function () { renderSpeak(); };
      });
      app.querySelectorAll("[data-sentence]").forEach(function (b) {
        b.onclick = function () { renderSentence(); };
      });
    }
    function node(nd, goHTML, extraCls) {
      return '<div class="node' + (extraCls ? " " + extraCls : "") + '">' +
               '<span class="n-emoji">' + nd.emoji + '</span>' +
               '<div class="n-body"><p class="n-title">' + nd.title + '</p><span class="n-skill">' + nd.skill + '</span></div>' +
               goHTML + '</div>';
    }

    function renderPlay(nodeId) {
      var nd = NODES.filter(function (x) { return x.id === nodeId; })[0];
      var spec = QUIZ[nd.quiz];
      btnSwitch.style.visibility = "hidden";
      LW.runQuiz({
        mount: app,
        items: spec.items(),
        length: 10,
        xpPerCorrect: 4,
        build: spec.build,
        onDone: function (summary) {
          LW.bumpStat(skillKey(nd.skill));
          var newSticker = null;
          var p = LW.Store.current();
          var pool = STICKERS.filter(function (s) { return p.stickers.indexOf(s) === -1; });
          if (pool.length) { newSticker = pool[Math.floor(Math.random() * pool.length)]; LW.addSticker(newSticker); }
          var newBadges = checkBadges();
          p = LW.Store.current();
          LW.fanfare(); LW.confetti(28);
          var li = LW.levelInfo(p.xp);
          app.innerHTML =
            '<div class="overlay"><div class="card">' +
              '<p class="big">' + p.pet + (summary.leveledUp ? "🎉" : "") + '</p>' +
              '<h2>' + (summary.leveledUp ? "Level " + li.level + "!" : "Great job!") + '</h2>' +
              '<p>You got <b>' + summary.correct + '</b> right and earned <b>+' + summary.xp + ' XP</b>.' +
                 (newSticker ? '<br>New sticker: <span style="font-size:34px">' + newSticker + '</span>' : '') + '</p>' +
              newBadgeHTML(newBadges) +
              '<button class="btn" id="again">Play again</button> ' +
              '<button class="btn ghost" id="back">Back to map</button>' +
            '</div></div>';
          app.querySelector("#again").onclick = function () { renderPlay(nodeId); };
          app.querySelector("#back").onclick = renderMap;
        }
      });
    }

    function renderRewards() {
      var p = LW.Store.current();
      var li = LW.levelInfo(p.xp);
      var owned = p.stickers.slice();
      var cells = "";
      var total = 18;
      for (var i = 0; i < total; i++) {
        cells += owned[i] ? '<div class="sticker">' + owned[i] + '</div>' : '<div class="sticker empty">?</div>';
      }
      var badgeCells = BADGES.map(function (b) {
        var have = p.badges.indexOf(b.id) !== -1;
        return '<div class="badge' + (have ? "" : " locked") + '">' +
                 '<div class="b-icon">' + b.icon + '</div>' +
                 '<div class="b-name">' + b.name + '</div>' +
                 '<div class="b-desc">' + (have ? b.desc : "🔒 Locked") + '</div></div>';
      }).join("");
      app.innerHTML =
        '<div class="center">' + petHTML(p, true) + '</div>' +
        '<p class="prompt center">' + p.name + ' &middot; Level ' + li.level + '</p>' +
        '<p class="center counts">⭐ ' + p.stars + ' stars &middot; 🎟️ ' + owned.length + ' / ' + total + ' stickers &middot; 🏅 ' + p.badges.length + ' / ' + BADGES.length + ' badges</p>' +
        '<p class="prompt center" style="font-size:20px;margin-top:14px">🏅 Badges</p>' +
        '<div class="badge-grid">' + badgeCells + '</div>' +
        '<p class="prompt center" style="font-size:20px;margin-top:14px">🎟️ Sticker album</p>' +
        '<div class="sticker-grid">' + cells + '</div>' +
        '<div class="center" style="margin-top:18px">' +
          '<button class="btn soft" id="cert">🏆 My certificate</button> ' +
          '<button class="btn" id="back">← Back to map</button></div>';
      app.querySelector("#back").onclick = renderMap;
      app.querySelector("#cert").onclick = renderCertificate;
    }

    function renderCertificate() {
      var p = LW.Store.current();
      var li = LW.levelInfo(p.xp);
      var earned = p.badges.map(function (id) { return BADGE_BY_ID[id]; }).filter(Boolean);
      var badgeIcons = earned.length ? earned.map(function (b) { return b.icon; }).join(" ") : "🌱";
      app.innerHTML =
        '<div class="cert" id="cert">' +
          '<div class="c-seal">🏆</div>' +
          '<div class="c-title">Certificate of Achievement</div>' +
          '<div class="c-sub">Learning World &middot; a reading adventure</div>' +
          '<div class="c-name">' + p.pet + " " + p.name + '</div>' +
          '<div class="c-line">has reached <b>Level ' + li.level + '</b> &mdash; earning <b>' + p.stars + '</b> stars, ' +
            '<b>' + p.stickers.length + '</b> stickers and <b>' + earned.length + '</b> badges!</div>' +
          '<div class="c-badges">' + badgeIcons + '</div>' +
          '<div class="c-foot"><span>Awarded by<b>Learning World</b></span><span>Keep it up!<b>' + p.pet + '</b></span></div>' +
        '</div>' +
        '<div class="center no-print" style="margin-top:16px">' +
          '<button class="btn soft" id="print">🖨️ Print / Save</button> ' +
          '<button class="btn" id="back">← Back</button></div>';
      app.querySelector("#print").onclick = function () { window.print(); };
      app.querySelector("#back").onclick = renderRewards;
    }

    function renderSettings() {
      var p = LW.Store.current();
      app.innerHTML =
        '<p class="prompt center">Settings &amp; backup</p>' +
        '<p class="center counts">Progress is saved on this device. Copy the code below to back up or move to another device.</p>' +
        '<textarea class="code-box" id="code" readonly>' + LW.Store.exportCode() + '</textarea>' +
        '<div class="center"><button class="btn soft" id="copy">Copy backup code</button></div>' +
        '<div class="center" style="margin-top:10px"><button class="btn ghost" id="switch2">👤 Switch / add player</button></div>' +
        '<div class="center" style="margin-top:18px">' +
          '<button class="link-btn" id="del">Delete this player (' + p.name + ')</button></div>' +
        '<div class="center" style="margin-top:8px"><button class="btn" id="back">← Back to map</button></div>';
      app.querySelector("#copy").onclick = function () {
        var t = app.querySelector("#code"); t.select();
        try { document.execCommand("copy"); this.textContent = "Copied!"; } catch (e) {}
      };
      app.querySelector("#switch2").onclick = renderGate;
      app.querySelector("#back").onclick = renderMap;
      app.querySelector("#del").onclick = function () {
        if (confirm("Delete " + p.name + "'s progress? This cannot be undone.")) { LW.Store.remove(p.id); renderGate(); }
      };
    }

    /* ---------- Writing: guided tracing with 5-star fading scaffold ---------- */
    var SESSION_LETTERS = 5;   // letters per writing round
    var PASSES = 5;            // stars per letter (fade to independence)
    var CANVAS = 320;         // internal resolution

    function renderWrite() {
      btnSwitch.style.visibility = "hidden";
      var letters = C.LETTERS;
      var start = LW.getProg("writeIdx", 0) % letters.length;
      var session = [];
      for (var i = 0; i < SESSION_LETTERS; i++) session.push(letters[(start + i) % letters.length]);
      var pos = 0, roundStars = 0, roundXP = 0;

      function done() {
        LW.bumpStat("writing");
        var newSticker = null;
        var p = LW.Store.current();
        var pool = STICKERS.filter(function (s) { return p.stickers.indexOf(s) === -1; });
        if (pool.length) { newSticker = pool[Math.floor(Math.random() * pool.length)]; LW.addSticker(newSticker); }
        var newBadges = checkBadges();
        LW.fanfare(); LW.confetti(28);
        app.innerHTML =
          '<div class="overlay"><div class="card">' +
            '<p class="big">✍️</p><h2>You wrote ' + SESSION_LETTERS + ' letters!</h2>' +
            '<p>+' + roundXP + ' XP earned.' + (newSticker ? '<br>New sticker: <span style="font-size:34px">' + newSticker + '</span>' : '') + '</p>' +
            newBadgeHTML(newBadges) +
            '<button class="btn" id="again">Trace more</button> <button class="btn ghost" id="back">Back to map</button>' +
          '</div></div>';
        app.querySelector("#again").onclick = renderWrite;
        app.querySelector("#back").onclick = renderMap;
      }

      function showLetter() {
        if (pos >= session.length) { done(); return; }
        var d = session[pos];
        var starStr = "";
        for (var s = 0; s < PASSES; s++) starStr += "☆";
        var mp = Math.round(pos / session.length * 100);
        app.innerHTML =
          '<div class="mini-wrap"><div class="mini-bar"><div class="mini-fill" style="width:' + mp + '%"></div></div>' +
            '<span class="mini-txt">Letter ' + (pos + 1) + ' / ' + session.length + '</span></div>' +
          '<p class="prompt center">Trace the letter — say "' + d.s + '"</p>' +
          '<p class="w-letter" id="wl">' + d.L.toUpperCase() + '<span class="lower">' + d.L + '</span> &middot; ' + d.key + ' ' + d.e + '</p>' +
          '<div class="stars-row" id="stars">' + starStr + '</div>' +
          '<div class="trace-stack"><canvas class="ghost" id="cg" width="' + CANVAS + '" height="' + CANVAS + '"></canvas>' +
          '<canvas id="ct" width="' + CANVAS + '" height="' + CANVAS + '"></canvas></div>' +
          '<div class="trace-tools">' +
            '<button class="btn" id="hear">🔊 Hear</button>' +
            '<button class="btn ghost" id="clear">🔄 Clear</button>' +
            '<button class="btn soft" id="skip">Next →</button>' +
          '</div>';
        LW.say(d.s + " ... " + d.key, 0.8);
        setupTrace(d);
        document.getElementById("wl").onclick = function () { LW.say(d.s + " ... " + d.key, 0.8); };
        document.getElementById("hear").onclick = function () { LW.say(d.s + " ... " + d.key, 0.8); };
        document.getElementById("skip").onclick = function () { pos++; showLetter(); };
      }

      function setupTrace(d) {
        var cg = document.getElementById("cg"), ct = document.getElementById("ct");
        var gx = cg.getContext("2d"), tx = ct.getContext("2d");
        var font = "700 " + Math.floor(CANVAS * 0.72) + 'px "Fredoka", sans-serif';

        // build a mask of the letter's pixels (for coverage detection)
        var off = document.createElement("canvas"); off.width = CANVAS; off.height = CANVAS;
        var ox = off.getContext("2d");
        ox.font = font; ox.textAlign = "center"; ox.textBaseline = "middle";
        ox.fillStyle = "#000"; ox.fillText(d.L, CANVAS / 2, CANVAS / 2 + CANVAS * 0.03);
        var mdata = ox.getImageData(0, 0, CANVAS, CANVAS).data;
        var mask = new Uint8Array(CANVAS * CANVAS), maskCount = 0;
        for (var i = 0; i < mask.length; i++) { if (mdata[i * 4 + 3] > 100) { mask[i] = 1; maskCount++; } }

        var passes = 0, ghostOp = 0.32;
        function drawGhost() {
          gx.clearRect(0, 0, CANVAS, CANVAS);
          gx.font = font; gx.textAlign = "center"; gx.textBaseline = "middle";
          gx.fillStyle = "rgba(200,161,75," + ghostOp + ")";
          gx.fillText(d.L, CANVAS / 2, CANVAS / 2 + CANVAS * 0.03);
        }
        drawGhost();
        tx.lineWidth = 24; tx.lineCap = "round"; tx.lineJoin = "round"; tx.strokeStyle = "#7A1D1D";

        var drawing = false;
        function P(ev) {
          var r = ct.getBoundingClientRect(); var sc = CANVAS / r.width;
          var pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
          return { x: (pt.clientX - r.left) * sc, y: (pt.clientY - r.top) * sc };
        }
        function down(ev) { ev.preventDefault(); drawing = true; try { ct.setPointerCapture(ev.pointerId); } catch (e) {}
          var p = P(ev); tx.beginPath(); tx.moveTo(p.x, p.y); tx.lineTo(p.x + 0.1, p.y + 0.1); tx.stroke(); }
        function move(ev) { if (!drawing) return; ev.preventDefault(); var p = P(ev); tx.lineTo(p.x, p.y); tx.stroke(); }
        function up() { if (!drawing) return; drawing = false; checkPass(); }
        ct.addEventListener("pointerdown", down);
        ct.addEventListener("pointermove", move);
        ct.addEventListener("pointerup", up);
        ct.addEventListener("pointercancel", up);

        function checkPass() {
          var tdata = tx.getImageData(0, 0, CANVAS, CANVAS).data;
          var hit = 0, drawn = 0;
          for (var n = 0; n < mask.length; n++) {
            if (tdata[n * 4 + 3] > 0) { drawn++; if (mask[n]) hit++; }
          }
          if (drawn < 150) return; // barely drew anything — ignore
          var coverage = hit / maskCount;
          if (coverage >= 0.35) { // lenient for little hands
            passes++;
            LW.chime(true); LW.confetti(8); LW.addStar(1);
            var r = LW.awardXP(2); roundXP += 2; roundStars++;
            document.getElementById("stars").textContent =
              "★".repeat(passes) + "☆".repeat(Math.max(0, PASSES - passes));
            tx.clearRect(0, 0, CANVAS, CANVAS);
            ghostOp = Math.max(0.05, ghostOp * 0.7); drawGhost();
            if (passes >= PASSES) {
              LW.say("You wrote " + d.L + "! " + d.key + ".", 0.82);
              LW.setProg("writeIdx", (LW.getProg("writeIdx", 0) + 1) % C.LETTERS.length);
              setTimeout(function () { pos++; showLetter(); }, 1300);
            }
          } else {
            LW.say("Try to trace over the " + d.L + ".", 0.85);
          }
        }
        document.getElementById("clear").onclick = function () { tx.clearRect(0, 0, CANVAS, CANVAS); };
      }

      showLetter();
    }

    /* ---------- Speaking: listen & repeat (no mic) ---------- */
    function renderSpeak() {
      btnSwitch.style.visibility = "hidden";
      var items = LW.shuffle(C.WORDS.slice()).slice(0, 8);
      var pos = 0, roundXP = 0;

      function done() {
        LW.bumpStat("speaking");
        var newSticker = null;
        var p = LW.Store.current();
        var pool = STICKERS.filter(function (s) { return p.stickers.indexOf(s) === -1; });
        if (pool.length) { newSticker = pool[Math.floor(Math.random() * pool.length)]; LW.addSticker(newSticker); }
        var newBadges = checkBadges();
        LW.fanfare(); LW.confetti(28);
        app.innerHTML =
          '<div class="overlay"><div class="card">' +
            '<p class="big">🗣️</p><h2>Super speaking!</h2>' +
            '<p>You said <b>' + items.length + '</b> words &middot; +' + roundXP + ' XP.' +
              (newSticker ? '<br>New sticker: <span style="font-size:34px">' + newSticker + '</span>' : '') + '</p>' +
            newBadgeHTML(newBadges) +
            '<button class="btn" id="again">Say more</button> <button class="btn ghost" id="back">Back to map</button>' +
          '</div></div>';
        app.querySelector("#again").onclick = renderSpeak;
        app.querySelector("#back").onclick = renderMap;
      }

      function show() {
        if (pos >= items.length) { done(); return; }
        var d = items[pos];
        var mp = Math.round(pos / items.length * 100);
        app.innerHTML =
          '<div class="mini-wrap"><div class="mini-bar"><div class="mini-fill" style="width:' + mp + '%"></div></div>' +
            '<span class="mini-txt">' + (pos + 1) + ' / ' + items.length + '</span></div>' +
          '<p class="prompt center">Listen, then say it out loud!</p>' +
          '<div class="stim" id="sstim"><div class="stim-emoji">' + d.e + '</div><div class="stim-word">' + d.w + '</div></div>' +
          '<div class="trace-tools">' +
            '<button class="btn ghost" id="hear">🔊 Hear</button>' +
            '<button class="btn ghost" id="slow">🐢 Slowly</button>' +
          '</div>' +
          '<div class="center" style="margin-top:20px"><button class="btn big" id="said">🎤 I said it!</button></div>';
        setTimeout(function () { LW.say(d.w, 0.85); }, 300);
        document.getElementById("sstim").onclick = function () { LW.say(d.w, 0.85); };
        document.getElementById("hear").onclick = function () { LW.say(d.w, 0.85); };
        document.getElementById("slow").onclick = function () { LW.say(d.w, 0.5); };
        document.getElementById("said").onclick = function () {
          LW.chime(true); LW.confetti(12); LW.addStar(1);
          var r = LW.awardXP(3); roundXP += 3;
          LW.say("Great speaking! " + d.w + "!", 0.85);
          pos++; setTimeout(show, 1200);
        };
      }
      show();
    }

    /* ---------- Sentences: read a short decodable sentence aloud ---------- */
    function renderSentence() {
      btnSwitch.style.visibility = "hidden";
      var items = LW.shuffle(SENTENCES.slice()).slice(0, 5);
      var pos = 0, roundXP = 0;

      function done() {
        LW.bumpStat("reading");
        var newSticker = null;
        var p = LW.Store.current();
        var pool = STICKERS.filter(function (s) { return p.stickers.indexOf(s) === -1; });
        if (pool.length) { newSticker = pool[Math.floor(Math.random() * pool.length)]; LW.addSticker(newSticker); }
        var newBadges = checkBadges();
        LW.fanfare(); LW.confetti(28);
        app.innerHTML =
          '<div class="overlay"><div class="card">' +
            '<p class="big">📚</p><h2>Great reading!</h2>' +
            '<p>You read <b>' + items.length + '</b> sentences &middot; +' + roundXP + ' XP.' +
              (newSticker ? '<br>New sticker: <span style="font-size:34px">' + newSticker + '</span>' : '') + '</p>' +
            newBadgeHTML(newBadges) +
            '<button class="btn" id="again">Read more</button> <button class="btn ghost" id="back">Back to map</button>' +
          '</div></div>';
        app.querySelector("#again").onclick = renderSentence;
        app.querySelector("#back").onclick = renderMap;
      }

      function show() {
        if (pos >= items.length) { done(); return; }
        var d = items[pos];
        var mp = Math.round(pos / items.length * 100);
        app.innerHTML =
          '<div class="mini-wrap"><div class="mini-bar"><div class="mini-fill" style="width:' + mp + '%"></div></div>' +
            '<span class="mini-txt">' + (pos + 1) + ' / ' + items.length + '</span></div>' +
          '<p class="prompt center">Read it out loud!</p>' +
          '<div class="stim" id="sstim">' +
            '<div class="stim-emoji">' + d.e + '</div>' +
            '<div class="stim-word" style="font-size:clamp(22px,6vw,32px);max-width:340px;text-align:center;line-height:1.3">' + d.s + '</div></div>' +
          '<div class="trace-tools">' +
            '<button class="btn ghost" id="hear">🔊 Hear</button>' +
            '<button class="btn ghost" id="slow">🐢 Slowly</button>' +
          '</div>' +
          '<div class="center" style="margin-top:20px"><button class="btn big" id="said">📖 I read it!</button></div>';
        setTimeout(function () { LW.say(d.s, 0.85); }, 300);
        document.getElementById("sstim").onclick = function () { LW.say(d.s, 0.85); };
        document.getElementById("hear").onclick = function () { LW.say(d.s, 0.85); };
        document.getElementById("slow").onclick = function () { LW.say(d.s, 0.55); };
        document.getElementById("said").onclick = function () {
          LW.chime(true); LW.confetti(12); LW.addStar(1);
          LW.awardXP(4); roundXP += 4;
          LW.say("Great reading!", 0.9);
          pos++; setTimeout(show, 1100);
        };
      }
      show();
    }

    btnSwitch.onclick = renderGate;

    // boot
    if (LW.Store.current()) renderMap(); else renderGate();
  })();
  </script>

  /* register the offline service worker (progressive — no effect if unsupported) */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
  </script>
