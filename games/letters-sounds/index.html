<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFF8E7" />
  <title>Letters &amp; Sounds &middot; Kartik Lodha</title>
  <meta name="description" content="Learn every letter and its sound, trace it, then a friendly quiz keeps testing the tricky ones again and again. Built on the science of reading." />
  <meta name="robots" content="noai, noimageai" />
  <meta name="author" content="Kartik Lodha" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Fredoka:wght@500;600;700&display=swap" />

  <style>
    :root {
      --parchment-light: #FBF1D9;
      --parchment:       #F2E2B1;
      --parchment-dark:  #E5CE8A;
      --maroon:          #7A1D1D;
      --gold:            #C8A14B;
      --gold-deep:       #8C6A1F;
      --ink:             #3A1F0E;
      --ink-soft:        #5C3A1F;
      --green:           #2E7D32;
      --green-soft:      #d8f0d8;
      --shadow-soft: 0 2px 0 rgba(58, 31, 14, 0.10), 0 6px 18px rgba(58, 31, 14, 0.10);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Fredoka", "Patrick Hand", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(200, 161, 75, 0.18), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(122, 29, 29, 0.10), transparent 40%),
        linear-gradient(180deg, var(--parchment-light), var(--parchment));
      min-height: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
    .home-link {
      text-decoration: none; font-family: "Caveat", cursive; font-weight: 700; font-size: 22px;
      color: var(--gold-deep); background: rgba(255,248,225,0.7); border: 1.5px solid var(--gold);
      border-radius: 999px; padding: 6px 16px; white-space: nowrap;
    }
    .game-title { font-family: "Caveat", cursive; font-weight: 700; font-size: 28px; color: var(--maroon); margin: 0; text-align: center; flex: 1; }
    .stars-badge {
      font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; color: var(--gold-deep);
      background: rgba(255,248,225,0.7); border: 1.5px solid var(--gold); border-radius: 999px;
      padding: 6px 14px; white-space: nowrap; min-width: 66px; text-align: center;
    }

    .mode-toggle { display: flex; justify-content: center; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
    .mode-btn {
      font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; color: var(--ink-soft);
      background: rgba(255,255,255,0.55); border: 2px solid var(--gold); border-radius: 999px;
      padding: 8px 20px; cursor: pointer; transition: transform 120ms ease, background 120ms ease, color 120ms ease;
    }
    .mode-btn.active { background: var(--maroon); color: #FFF8E7; }
    .mode-btn:active { transform: scale(0.95); }

    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 4px 16px 28px; width: 100%; max-width: 640px; margin: 0 auto; }
    .prompt { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: clamp(20px, 5vw, 28px);
      color: var(--ink-soft); text-align: center; margin: 6px 0 14px; min-height: 1.2em; }

    /* ---- LEARN ---- */
    .learn-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
    .arrow { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 38px; color: #FFF8E7; background: var(--gold);
      border: none; border-radius: 50%; width: 56px; height: 56px; flex: 0 0 auto; cursor: pointer;
      box-shadow: var(--shadow-soft); line-height: 1; transition: transform 120ms ease, background 120ms ease; }
    .arrow:active { transform: scale(0.9); } .arrow:hover { background: var(--gold-deep); }
    .big-card { background: rgba(255,255,255,0.7); border: 4px solid var(--gold); border-radius: 26px;
      box-shadow: var(--shadow-soft); padding: 14px 12px 18px; text-align: center; flex: 1 1 auto; max-width: 420px; }
    .big-letter { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(72px, 22vw, 128px); line-height: 1; color: var(--maroon); margin: 0; cursor: pointer; }
    .big-letter .lower { color: var(--gold-deep); font-size: 0.55em; }
    .big-emoji { font-size: clamp(56px, 18vw, 96px); line-height: 1; margin: 2px 0; cursor: pointer; }
    .big-word { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: clamp(22px, 6vw, 34px); color: var(--ink); margin: 0; }
    .big-word b { color: var(--maroon); }

    /* ---- tracing ---- */
    .trace-box { margin: 12px auto 0; position: relative; width: min(280px, 78vw); height: min(280px, 78vw); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.5);
      border: 3px dashed var(--gold); border-radius: 20px; touch-action: none; }
    .trace-tools { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

    .btn { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; color: #FFF8E7; background: var(--maroon);
      border: none; border-radius: 999px; padding: 10px 22px; cursor: pointer; box-shadow: var(--shadow-soft); }
    .btn.soft { background: var(--gold); color: var(--ink); }
    .btn.ghost { background: rgba(255,255,255,0.6); color: var(--ink-soft); border: 2px solid var(--gold); }
    .btn:active { transform: scale(0.95); }

    /* ---- QUIZ ---- */
    .speaker { font-size: 64px; background: rgba(255,255,255,0.7); border: 4px solid var(--gold); border-radius: 24px;
      width: 130px; height: 110px; cursor: pointer; box-shadow: var(--shadow-soft); margin-bottom: 6px; line-height: 1; transition: transform 120ms ease; }
    .speaker:active { transform: scale(0.94); }
    .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 420px; margin-top: 14px; }
    .choices.three { grid-template-columns: repeat(3, 1fr); max-width: 480px; }
    .choice { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(48px, 16vw, 84px); color: var(--maroon);
      background: rgba(255,255,255,0.7); border: 4px solid var(--gold); border-radius: 22px; aspect-ratio: 1/1; cursor: pointer;
      box-shadow: var(--shadow-soft); transition: transform 120ms ease, background 120ms ease, border-color 120ms ease; }
    .choice:active { transform: scale(0.94); }
    .choice.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .choice.reveal { animation: pulse 0.8s ease-in-out infinite; border-color: var(--green); }
    .choice.wrong { animation: shake 0.4s; opacity: 0.4; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

    /* ---- MY LETTERS ---- */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 10px; width: 100%; max-width: 560px; margin-top: 8px; }
    .cell { aspect-ratio: 1/1; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-family: "Fredoka", sans-serif; font-weight: 700; font-size: clamp(24px, 7vw, 34px); border: 3px solid var(--gold);
      background: rgba(255,255,255,0.35); color: var(--parchment-dark); position: relative; }
    .cell.seen { color: var(--gold-deep); background: rgba(255,248,225,0.85); }
    .cell.learning { color: var(--maroon); background: #fff3d6; border-color: var(--gold-deep); }
    .cell.mastered { color: var(--green); background: var(--green-soft); border-color: var(--green); }
    .cell .tick { position: absolute; top: 2px; right: 5px; font-size: 13px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 14px 0 4px; font-size: 15px; color: var(--ink-soft); }
    .legend span b { font-weight: 700; }
    .dot { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 2px solid var(--gold); }

    /* ---- celebration overlay ---- */
    .overlay { position: fixed; inset: 0; background: rgba(58,31,14,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
    .overlay .card { background: var(--parchment-light); border: 4px solid var(--gold); border-radius: 24px; padding: 26px 24px; text-align: center; max-width: 360px; box-shadow: var(--shadow-soft); }
    .overlay h2 { font-family: "Caveat", cursive; font-size: 40px; color: var(--maroon); margin: 4px 0 8px; }
    .overlay p { font-size: 19px; color: var(--ink-soft); margin: 4px 0 16px; }
    .overlay .big { font-size: 64px; margin: 0; }

    .confetti { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 70; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.9; } }

    footer { text-align: center; font-size: 12px; color: var(--ink-soft); opacity: 0.7; padding: 4px 0 14px; }
    .tiny-reset { background: none; border: none; color: var(--ink-soft); opacity: 0.6; font-size: 13px; text-decoration: underline; cursor: pointer; margin-top: 18px; }
  </style>
  <script src="../../learn/engine.js"></script>
  <script src="../../learn/bridge.js"></script>
</head>
<body>
  <div class="topbar">
    <a class="home-link" href="../../index.html">&#x2190; Home</a>
    <h1 class="game-title">Letters &amp; Sounds</h1>
    <span class="stars-badge" id="stars">&#x2B50; 0</span>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn" id="m-learn">&#x1F4D6; Learn</button>
    <button class="mode-btn active" id="m-quiz">&#x1F3AF; Quiz</button>
    <button class="mode-btn" id="m-mine">&#x2B50; My Letters</button>
  </div>

  <div class="stage" id="stage"></div>

  <footer>&#xA9; Kartik Lodha &middot; built on the science of reading, for little learners</footer>

  <script>
  (function () {
    "use strict";

    // Curriculum order (decodable-first: s,a,t,p,i,n...); confusable pairs kept apart.
    // s = sound approximation for TTS (anchored by the keyword so it's always clear).
    var DATA = [
      { L:"s", key:"snake",    e:"🐍", s:"sss"  },
      { L:"a", key:"apple",    e:"🍎", s:"aah"  },
      { L:"t", key:"tiger",    e:"🐯", s:"tuh"  },
      { L:"p", key:"pig",      e:"🐷", s:"puh"  },
      { L:"i", key:"insect",   e:"🐜", s:"ih"   },
      { L:"n", key:"nose",     e:"👃", s:"nnn"  },
      { L:"d", key:"dog",      e:"🐶", s:"duh"  },
      { L:"m", key:"monkey",   e:"🐵", s:"mmm"  },
      { L:"g", key:"goat",     e:"🐐", s:"guh"  },
      { L:"o", key:"octopus",  e:"🐙", s:"oh"   },
      { L:"c", key:"cat",      e:"🐱", s:"kuh"  },
      { L:"k", key:"kite",     e:"🪁", s:"kuh"  },
      { L:"e", key:"egg",      e:"🥚", s:"eh"   },
      { L:"h", key:"hat",      e:"🎩", s:"huh"  },
      { L:"u", key:"umbrella", e:"☂️", s:"uh"   },
      { L:"r", key:"rabbit",   e:"🐰", s:"rrr"  },
      { L:"b", key:"ball",     e:"⚽", s:"buh"  },
      { L:"f", key:"fish",     e:"🐟", s:"fff"  },
      { L:"l", key:"lion",     e:"🦁", s:"lll"  },
      { L:"j", key:"juice",    e:"🧃", s:"juh"  },
      { L:"v", key:"van",      e:"🚐", s:"vvv"  },
      { L:"w", key:"whale",    e:"🐳", s:"wuh"  },
      { L:"y", key:"yo-yo",    e:"🪀", s:"yuh"  },
      { L:"z", key:"zebra",    e:"🦓", s:"zzz"  },
      { L:"x", key:"box",      e:"📦", s:"kss"  },
      { L:"q", key:"queen",    e:"👑", s:"kwuh" }
    ];
    var BY = {}; DATA.forEach(function (d, i) { d.idx = i; BY[d.L] = d; });
    // confusable letters — used to place hard distractors together (b/d, p/q, m/n, u/n)
    var CONFUSE = { b:"d", d:"b", p:"q", q:"p", m:"n", n:"m", u:"n", v:"w", w:"v" };

    var MAX_INTRO_PER_SESSION = 4;   // gentle: a few new letters per session
    var ROUND_LEN = 14;              // ~short session
    var OFFSET = [2, 3, 5, 8, 12, 16]; // Leitner reinsertion spacing by box (expanding)

    /* ---------- persistence ---------- */
    var PKEY = "ls_progress_v1", SKEY = "ls_stars_v1";
    var progress = {}; // L -> box (0..5); absent = not yet introduced
    var stars = 0;
    try { progress = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { progress = {}; }
    try { stars = parseInt(localStorage.getItem(SKEY), 10) || 0; } catch (e) { stars = 0; }
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(progress)); localStorage.setItem(SKEY, String(stars)); } catch (e) {}
    }
    function setStars(n) { stars = n; document.getElementById("stars").innerHTML = "⭐ " + stars; save(); if (window.LWB) LWB.onStars(n, "listening", 3); }
    setStars(stars);

    /* ---------- speech ---------- */
    var voice = null;
    function pickVoice() {
      try {
        var vs = window.speechSynthesis.getVoices();
        for (var i = 0; i < vs.length; i++) { if (/en[-_]/i.test(vs[i].lang)) { voice = vs[i]; break; } }
        if (!voice && vs.length) voice = vs[0];
      } catch (e) {}
    }
    if ("speechSynthesis" in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
    function say(text, rate) {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.rate = rate || 0.85; u.pitch = 1.12;
        if (voice) u.voice = voice;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
    // say the SOUND then anchor with the keyword: "sss ... snake"
    function sayLetter(d) { say(d.s + " ... " + d.key, 0.8); }

    /* ---------- chime + confetti ---------- */
    var actx = null;
    function chime(good) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        var notes = good ? [523, 659, 784] : [392, 330];
        notes.forEach(function (f, i) {
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
          var t = actx.currentTime + i * 0.11;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          o.start(t); o.stop(t + 0.22);
        });
      } catch (e) {}
    }
    function confetti(n) {
      var emojis = ["⭐","🌟","✨","🎉","🎊","🌼"];
      for (var i = 0; i < (n || 16); i++) {
        var el = document.createElement("div");
        el.className = "confetti"; el.textContent = emojis[i % emojis.length];
        el.style.left = (Math.random() * 100) + "vw";
        el.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
        el.style.fontSize = (22 + Math.random() * 22) + "px";
        document.body.appendChild(el);
        (function (x) { setTimeout(function () { x.remove(); }, 3200); })(el);
      }
    }
    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

    var stage = document.getElementById("stage");
    var btnLearn = document.getElementById("m-learn");
    var btnQuiz  = document.getElementById("m-quiz");
    var btnMine  = document.getElementById("m-mine");

    /* ================= LEARN MODE ================= */
    var learnIdx = 0;
    function renderLearn(speakIt) {
      var d = DATA[learnIdx];
      stage.innerHTML =
        '<p class="prompt">Tap to hear the sound &middot; then trace it!</p>' +
        '<div class="learn-wrap">' +
          '<button class="arrow" id="prev">&#x2039;</button>' +
          '<div class="big-card">' +
            '<p class="big-letter" id="ll">' + d.L.toUpperCase() + '<span class="lower">' + d.L + '</span></p>' +
            '<div class="big-emoji" id="le">' + d.e + '</div>' +
            '<p class="big-word"><b>' + d.L + '</b> for ' + d.key + '</p>' +
          '</div>' +
          '<button class="arrow" id="next">&#x203A;</button>' +
        '</div>' +
        '<div class="trace-box"><canvas id="pad"></canvas></div>' +
        '<div class="trace-tools">' +
          '<button class="btn" id="hear">&#x1F50A; Hear</button>' +
          '<button class="btn ghost" id="clear">&#x1F504; Clear</button>' +
          '<button class="btn soft" id="done">&#x2713; Done</button>' +
        '</div>';
      document.getElementById("prev").onclick = function () { learnIdx = (learnIdx + DATA.length - 1) % DATA.length; renderLearn(true); };
      document.getElementById("next").onclick = function () { learnIdx = (learnIdx + 1) % DATA.length; renderLearn(true); };
      document.getElementById("ll").onclick = function () { sayLetter(d); };
      document.getElementById("le").onclick = function () { say(d.key, 0.85); };
      document.getElementById("hear").onclick = function () { sayLetter(d); };
      setupPad(d);
      if (speakIt) sayLetter(d);
    }
    function setupPad(d) {
      var cv = document.getElementById("pad");
      var dpr = window.devicePixelRatio || 1;
      var rect = cv.getBoundingClientRect();
      cv.width = rect.width * dpr; cv.height = rect.height * dpr;
      var ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
      var W = rect.width, H = rect.height;
      function ghost() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.fillStyle = "rgba(200,161,75,0.30)";
        ctx.font = "700 " + Math.floor(H * 0.8) + 'px "Fredoka", sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(d.L, W / 2, H / 2 + H * 0.03);
        ctx.restore();
      }
      ghost();
      ctx.lineWidth = 14; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#7A1D1D";
      var drawing = false;
      function pos(ev) {
        var r = cv.getBoundingClientRect();
        var p = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
      }
      function down(ev) { ev.preventDefault(); drawing = true; var p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
      function move(ev) { if (!drawing) return; ev.preventDefault(); var p = pos(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      function up() { drawing = false; }
      cv.addEventListener("pointerdown", down); cv.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      document.getElementById("clear").onclick = function () { ghost(); };
      document.getElementById("done").onclick = function () {
        chime(true); confetti(12); say("Great! " + d.s + " ... " + d.key + ".", 0.8);
      };
    }

    /* ================= QUIZ MODE (spaced retrieval engine) ================= */
    var queue = [];          // letters scheduled to be tested
    var introduced = [];     // letters already introduced (in progress)
    var newThisSession = 0;
    var trialsThisRound = 0;
    var sessionStars = 0;
    var correctSinceIntro = 0;

    function nextUnintroduced() {
      for (var i = 0; i < DATA.length; i++) { if (progress[DATA[i].L] === undefined) return DATA[i].L; }
      return null;
    }
    function refreshIntroduced() { introduced = DATA.map(function (d) { return d.L; }).filter(function (L) { return progress[L] !== undefined; }); }

    function startQuiz() {
      refreshIntroduced();
      newThisSession = 0; trialsThisRound = 0; sessionStars = 0; correctSinceIntro = 0;
      queue = shuffle(introduced.slice());
      if (introduced.length === 0) { introduceLetter(nextUnintroduced(), true); }
      else { nextTrial(); }
    }

    function introduceLetter(L, thenTrial) {
      if (!L) { nextTrial(); return; }
      progress[L] = 0; save(); refreshIntroduced(); newThisSession++;
      var d = BY[L];
      // short intro block: show it, say sound+keyword, add near the front a couple times
      stage.innerHTML =
        '<p class="prompt">A new letter!</p>' +
        '<div class="big-card" style="margin:0 auto;max-width:340px">' +
          '<p class="big-letter" style="cursor:pointer" id="il">' + d.L.toUpperCase() + '<span class="lower">' + d.L + '</span></p>' +
          '<div class="big-emoji">' + d.e + '</div>' +
          '<p class="big-word">This says <b>' + d.s + '</b><br>' + d.L + ' for ' + d.key + '</p>' +
        '</div>' +
        '<button class="btn" id="goon" style="margin-top:18px">Let’s try! &#x2192;</button>';
      document.getElementById("il").onclick = function () { sayLetter(d); };
      document.getElementById("goon").onclick = function () {
        queue.unshift(L); queue.splice(Math.min(2, queue.length), 0, L); // test it soon, twice
        if (thenTrial !== false) nextTrial();
      };
      setTimeout(function () { say("A new letter! " + d.s + " ... " + d.key + ".", 0.8); }, 250);
    }

    function boxOf(L) { return Math.max(0, Math.min(5, progress[L] || 0)); }
    function numChoices(L) { var b = boxOf(L); return b <= 1 ? 2 : (b <= 3 ? 3 : 4); }

    function pickDistractors(target, n) {
      var pool = introduced.filter(function (L) { return L !== target; });
      var picks = [];
      var conf = CONFUSE[target];
      if (conf && pool.indexOf(conf) !== -1 && boxOf(target) >= 1) { picks.push(conf); } // train discrimination
      pool = shuffle(pool.filter(function (L) { return picks.indexOf(L) === -1; }));
      while (picks.length < n && pool.length) picks.push(pool.shift());
      // pad from full set if not enough letters introduced yet
      if (picks.length < n) {
        var extra = shuffle(DATA.map(function (d) { return d.L; }).filter(function (L) { return L !== target && picks.indexOf(L) === -1; }));
        while (picks.length < n && extra.length) picks.push(extra.shift());
      }
      return picks;
    }

    function endRound() {
      var mastered = DATA.filter(function (d) { return boxOf(d.L) >= 5 && progress[d.L] !== undefined; }).length;
      stage.innerHTML =
        '<div class="overlay"><div class="card">' +
          '<p class="big">🎉</p>' +
          '<h2>Wonderful!</h2>' +
          '<p>You earned <b>⭐ ' + sessionStars + '</b> stars this round.<br>' +
             'You’re learning <b>' + introduced.length + '</b> letters' + (mastered ? ' &middot; <b>' + mastered + ' mastered!</b>' : '') + '</p>' +
          '<button class="btn" id="more">Keep playing &#x2192;</button><br>' +
          '<button class="tiny-reset" id="seemine">See My Letters</button>' +
        '</div></div>';
      document.getElementById("more").onclick = function () { startQuiz(); };
      document.getElementById("seemine").onclick = function () { setMode("mine"); };
      confetti(26);
    }

    function nextTrial() {
      if (trialsThisRound >= ROUND_LEN) { endRound(); return; }
      // maybe introduce a new letter (only when doing well, gradually)
      if (newThisSession < MAX_INTRO_PER_SESSION && correctSinceIntro >= 4) {
        var nu = nextUnintroduced();
        if (nu) { correctSinceIntro = 0; introduceLetter(nu, true); return; }
      }
      if (queue.length === 0) { queue = shuffle(introduced.slice()); if (queue.length === 0) { endRound(); return; } }

      var target = queue.shift();
      var d = BY[target];
      var n = numChoices(target);
      var opts = shuffle([target].concat(pickDistractors(target, n - 1)));
      trialsThisRound++;

      stage.innerHTML =
        '<p class="prompt">Which letter says this sound?</p>' +
        '<button class="speaker" id="spk">🔊</button>' +
        '<p class="prompt" style="margin:6px 0 0;font-size:16px;opacity:.75">Tap the speaker to hear it again</p>' +
        '<div class="choices' + (opts.length === 3 ? ' three' : '') + '" id="choices"></div>';
      var wrap = document.getElementById("choices");
      opts.forEach(function (L) {
        var b = document.createElement("button");
        b.className = "choice"; b.textContent = L; b.setAttribute("data-l", L);
        wrap.appendChild(b);
      });
      document.getElementById("spk").onclick = function () { sayLetter(d); };
      setTimeout(function () { sayLetter(d); }, 300);

      var answered = false, penalized = false;
      var tiles = wrap.querySelectorAll(".choice");
      tiles.forEach(function (tile) {
        tile.onclick = function () {
          if (answered) return;
          var L = tile.getAttribute("data-l");
          if (L === target) {
            answered = true;
            tile.classList.add("correct");
            chime(true); confetti(14);
            if (!penalized) {
              progress[target] = Math.min(5, boxOf(target) + 1);
              setStars(stars + 1); sessionStars++; correctSinceIntro++;
              if (progress[target] === 5) { setTimeout(function () { say("You mastered " + target + "! " + d.key + "!", 0.85); }, 300); }
              else { say("Yes! " + d.s + " ... " + d.key + "!", 0.82); }
            } else {
              say(d.s + " ... " + d.key + ".", 0.82); // corrected, no star
            }
            save();
            var off = OFFSET[boxOf(target)];
            queue.splice(Math.min(off, queue.length), 0, target); // spaced re-test
            setTimeout(nextTrial, 1500);
          } else {
            // no-fail: gentle, then reveal the correct one with its sound
            tile.classList.add("wrong"); tile.style.pointerEvents = "none";
            chime(false);
            if (!penalized) { penalized = true; progress[target] = Math.max(0, boxOf(target) - 1); save(); correctSinceIntro = 0; }
            var correctTile = wrap.querySelector('[data-l="' + target + '"]');
            correctTile.classList.add("reveal");
            say("Try this one. " + d.s + " ... " + d.key + ".", 0.8);
          }
        };
      });
    }

    /* ================= MY LETTERS ================= */
    function renderMine() {
      var html = '<p class="prompt">Every letter he’s learning &mdash; saved on this device</p>';
      html += '<div class="legend">' +
        '<span><i class="dot" style="background:rgba(255,255,255,.35)"></i>Not yet</span>' +
        '<span><i class="dot" style="background:#fff3d6;border-color:var(--gold-deep)"></i>Learning</span>' +
        '<span><i class="dot" style="background:var(--green-soft);border-color:var(--green)"></i>Mastered</span>' +
        '</div>';
      html += '<div class="grid">';
      DATA.forEach(function (d) {
        var b = progress[d.L];
        var cls = "cell", tick = "";
        if (b === undefined) { cls += ""; }
        else if (b >= 5) { cls += " mastered"; tick = '<span class="tick">✓</span>'; }
        else if (b >= 2) { cls += " learning"; }
        else { cls += " seen"; }
        html += '<div class="' + cls + '">' + d.L + tick + '</div>';
      });
      html += '</div>';
      var learned = DATA.filter(function (d) { return progress[d.L] !== undefined; }).length;
      var mastered = DATA.filter(function (d) { return (progress[d.L] || 0) >= 5; }).length;
      html += '<p class="prompt" style="margin-top:16px;font-size:19px">Learning <b>' + learned + '</b> / 26 &middot; Mastered <b>' + mastered + '</b> &middot; ⭐ ' + stars + '</p>';
      html += '<button class="tiny-reset" id="reset">Reset progress (for parents)</button>';
      stage.innerHTML = html;
      document.getElementById("reset").onclick = function () {
        if (window.confirm("Reset all learning progress and stars?")) {
          progress = {}; setStars(0); save(); renderMine();
        }
      };
    }

    /* ================= mode switch ================= */
    var mode = "quiz";
    function setMode(m) {
      mode = m;
      btnLearn.classList.toggle("active", m === "learn");
      btnQuiz.classList.toggle("active", m === "quiz");
      btnMine.classList.toggle("active", m === "mine");
      if (m === "learn") renderLearn(true);
      else if (m === "quiz") startQuiz();
      else renderMine();
    }
    btnLearn.onclick = function () { setMode("learn"); };
    btnQuiz.onclick  = function () { setMode("quiz"); };
    btnMine.onclick  = function () { setMode("mine"); };

    // start in Quiz
    startQuiz();
  })();
  </script>
</body>
</html>
