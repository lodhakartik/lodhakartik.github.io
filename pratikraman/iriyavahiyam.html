  <meta name="robots" content="noai, noimageai" />

  <style>
    :root {
      --parchment-light: #FBF1D9;
      --parchment:       #F2E2B1;
      --maroon:          #7A1D1D;
      --gold:            #C8A14B;
      --gold-deep:       #8C6A1F;
      --ink:             #3A1F0E;
      --ink-soft:        #5C3A1F;
      --panel-bg:        #FFFBF0;
      --hl:              #FFF3CD;
      --shadow-soft: 0 2px 0 rgba(58,31,14,.08), 0 5px 14px rgba(58,31,14,.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Patrick Hand", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(200,161,75,.16), transparent 42%),
        radial-gradient(circle at 90% 100%, rgba(122,29,29,.10), transparent 42%),
        linear-gradient(180deg, var(--parchment-light), var(--parchment));
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .dev      { font-family: "Yatra One", "Mukta", serif; }
    .dev-body { font-family: "Mukta", system-ui, sans-serif; }

    /* ---------- slim top bar ---------- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1.5px solid var(--gold);
      background: rgba(255,251,240,.7);
      backdrop-filter: blur(4px);
    }
    .topbar .back { color: var(--maroon); font-weight: 700; text-decoration: none; font-size: .95rem; white-space: nowrap; }
    .topbar .title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .topbar .title .dv { font-family: "Yatra One", serif; color: var(--maroon); font-size: 1.35rem; line-height: 1; }
    .topbar .title .rom { color: var(--ink-soft); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .draft { font-size: .68rem; background: #FFF3CD; border: 1px dashed var(--gold-deep); color: var(--gold-deep); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .spacer { flex: 1; }

    /* language toggle */
    .lang-toggle { display: inline-flex; border: 1.5px solid var(--maroon); border-radius: 999px; overflow: hidden; }
    .lang-toggle button {
      font-family: "Mukta", sans-serif; font-weight: 700; font-size: .82rem;
      border: none; background: #fff; color: var(--maroon);
      padding: 5px 14px; cursor: pointer;
    }
    .lang-toggle button.on { background: var(--maroon); color: #fff; }

    /* prev/next */
    .nav-btns { display: inline-flex; gap: 6px; }
    .nav-btns button {
      font-family: "Mukta", sans-serif; font-weight: 700; font-size: .95rem;
      border: 1.5px solid var(--maroon); background: #fff; color: var(--maroon);
      border-radius: 999px; width: 34px; height: 34px; cursor: pointer;
    }
    .nav-btns button:disabled { opacity: .35; cursor: not-allowed; }

    /* ---------- 4-panel grid, fills remaining height ---------- */
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1.15fr 1fr;
      grid-template-areas:
        "sutra   words"
        "meaning pic";
      gap: 12px;
      padding: 12px 16px 14px;
    }
    .panel {
      background: var(--panel-bg);
      border: 1.5px solid var(--gold);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      padding: 24px 14px 12px;
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel .label {
      position: absolute; top: -10px; left: 14px;
      background: var(--maroon); color: #fff;
      font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px;
    }
    .panel .body { overflow-y: auto; min-height: 0; padding-right: 4px; }
    #sutra   { grid-area: sutra; }
    #meaning { grid-area: meaning; }
    #words   { grid-area: words; }
    #pic     { grid-area: pic; }

    /* ---- Panels A & B: flowing paragraph with synced phrase-boxes ---- */
    .para { margin: 0; }
    #sutra .para   { font-family: "Yatra One", serif; color: var(--maroon); font-size: 1.24rem; line-height: 2.0; }
    #meaning .para { font-family: "Mukta", sans-serif; color: var(--ink); font-size: 1.02rem; line-height: 1.95; }

    .ph {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      border: 1.5px solid transparent;   /* the box, transparent until synced */
      transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .ph sup { font-family: "Mukta", sans-serif; font-size: .55em; color: var(--gold-deep); font-weight: 700; padding-left: 1px; vertical-align: super; }
    /* hover-sync box (lighter) */
    .ph.hl { background: rgba(200,161,75,.22); border-color: var(--gold-deep); }
    /* selected box (stronger, persistent) */
    .ph.active { background: var(--hl); border-color: var(--maroon); box-shadow: 0 0 0 1px var(--maroon); }

    /* ---- Panel C: word-by-word ---- */
    .word { display: grid; grid-template-columns: minmax(78px,auto) 1fr; gap: 10px; align-items: baseline; padding: 5px 4px; border-bottom: 1px dotted rgba(140,106,31,.32); }
    .word:last-child { border-bottom: none; }
    .word .w { font-family: "Yatra One", serif; color: var(--maroon); font-size: 1.04rem; }
    .word .w small { display: block; font-family: "Mukta"; font-style: italic; color: var(--ink-soft); font-size: .68rem; }
    .word .m { font-family: "Mukta", sans-serif; font-size: .92rem; color: var(--ink); }

    /* ---- Panel D: pictorial meaning ---- */
    #pic .body { align-items: center; text-align: center; display: flex; flex-direction: column; }
    .pic-frame {
      width: 100%; max-width: 240px; aspect-ratio: 4/3; margin: 0 auto 8px;
      border: 2px dashed var(--gold); border-radius: 12px;
      background: repeating-linear-gradient(45deg, #fff, #fff 10px, #FDF6E3 10px, #FDF6E3 20px);
      display: grid; place-items: center; overflow: hidden; position: relative;
    }
    .pic-frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .pic-frame .ph { font-family: "Mukta"; color: var(--gold-deep); font-size: .8rem; padding: 8px; }
    .pic-cap { font-family: "Mukta", sans-serif; font-size: .9rem; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.4; }
    .prompt-btn {
      font-family: "Mukta", sans-serif; font-weight: 700; font-size: .8rem;
      border: 1.5px solid var(--gold-deep); background: #fff; color: var(--gold-deep);
      border-radius: 999px; padding: 5px 12px; cursor: pointer;
    }
    .prompt-btn:hover { background: var(--gold-deep); color: #fff; }
    .prompt-box { display: none; margin-top: 8px; width: 100%; }
    .prompt-box textarea {
      width: 100%; height: 76px; font-family: "Mukta", sans-serif; font-size: .74rem;
      border: 1px solid var(--gold); border-radius: 8px; padding: 6px; resize: none; color: var(--ink-soft);
      background: #fffdf6;
    }

    /* ---------- responsive: allow scroll on small screens ---------- */
    @media (max-width: 720px) {
      body { height: auto; overflow: auto; }
      .stage {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-template-areas: "sutra" "meaning" "words" "pic";
      }
      .panel { min-height: 200px; }
    }
  </style>

        prakrit: "अभिहया वत्तिया लेसिया संघाइया संघट्टिया परियाविया किलामिया उद्दविया ठाणाओ ठाणं संकामिया जीवियाओ ववरोविया — तस्स मिच्छा मि दुक्कडं।",
        rom: "Abhihayā vattiyā lesiyā saṅghāiyā saṅghaṭṭiyā pariyāviyā kilāmiyā uddaviyā ṭhāṇāo ṭhāṇaṁ saṅkāmiyā jīviyāo vavaroviyā — tassa micchā mi dukkaḍaṁ.",
        hi: "जिन्हें मैंने मारा हो, धूल से ढका हो, भूमि पर रगड़ा हो, एकत्र/परस्पर टकराया हो, स्पर्श किया हो, पीड़ा दी हो, थकाया हो, भयभीत किया हो, एक स्थान से दूसरे स्थान पर पहुँचाया हो, या प्राणों से रहित (मारा) किया हो — उन सबके लिए मेरा वह पाप मिथ्या (निष्फल) हो। मिच्छामि दुक्कडं।",
        en: "whom I may have struck, covered with dust, rubbed on the ground, gathered/collided together, touched, tormented, exhausted, frightened, moved from place to place, or deprived of life — for all of that, may my wrong-doing be undone. Micchāmi Dukkaḍaṁ.",
        words: [
          { w: "अभिहया",   t: "abhihayā",   hi: "मारा / ठोकर लगाई", en: "struck / kicked" },
          { w: "वत्तिया",   t: "vattiyā",    hi: "धूल से ढका", en: "covered with dust" },
          { w: "लेसिया",    t: "lesiyā",     hi: "भूमि पर रगड़ा", en: "rubbed on the ground" },
          { w: "संघाइया",  t: "saṅghāiyā",  hi: "एकत्र / टकराया", en: "gathered / collided" },
          { w: "संघट्टिया", t: "saṅghaṭṭiyā",hi: "स्पर्श / टक्कर", en: "touched / knocked" },
          { w: "परियाविया", t: "pariyāviyā", hi: "पीड़ा दी", en: "tormented / pained" },
          { w: "किलामिया",  t: "kilāmiyā",   hi: "थकाया", en: "fatigued / exhausted" },
          { w: "उद्दविया",  t: "uddaviyā",   hi: "भयभीत किया", en: "frightened / terrified" },
          { w: "ठाणाओ ठाणं संकामिया", t: "ṭhāṇāo ṭhāṇaṁ saṅkāmiyā", hi: "एक स्थान से दूसरे स्थान पहुँचाया", en: "moved from place to place" },
          { w: "जीवियाओ ववरोविया", t: "jīviyāo vavaroviyā", hi: "प्राणों से रहित किया (मारा)", en: "deprived of life (killed)" },
          { w: "तस्स",       t: "tassa",      hi: "उसके लिए", en: "for that" },
          { w: "मिच्छा मि दुक्कडं", t: "micchā mi dukkaḍaṁ", hi: "मेरा पाप मिथ्या / निष्फल हो", en: "may my misdeed be in vain / forgiven" }
        ],
        pic: "A Jain devotee in white kneeling with folded hands and a bowed head in sincere repentance, a warm radiant golden light of forgiveness gently surrounding them and dissolving faint grey shadows of past faults into light. A muhpatti and a rajoharan whisk rest respectfully nearby. Peaceful, uplifting, a deep feeling of release, inner purity and 'Micchami Dukkadam'.",
        capHi: "सच्चे पश्चात्ताप से — ‘मिच्छामि दुक्कडं’।",
        capEn: "With sincere repentance — ‘Micchāmi Dukkaḍaṁ’."
      }
    ];

    const IMG_PREFIX = "img/iriyavahiyam-";   // drop img/iriyavahiyam-0.png ... -6.png to fill Panel D

    // Shared render style + Sthanakvasi guardrails, appended to every image prompt.
    const PIC_STYLE = "Rendered as a hand-drawn COLORED-PENCIL SKETCH: visible pencil strokes and paper tooth, soft layered shading, delicate line work, warm gentle earthy palette (cream, ochre-gold, deep maroon, muted sage green, soft browns) on an aged parchment-cream background. Serene, tender, devotional Jain mood. Sthanakvasi tradition — strictly aniconic: NO idols, murtis or ornate temple; any monk/nun wears plain white cloth with a white muhpatti (mouth-cloth) and holds a soft woolen rajoharan whisk; laypeople in simple modest clothes. No text, no lettering, no logos. 4:3 composition, gentle soft lighting.";
    let cur = 0;
    let lang = "hi";

    const sutraBody   = document.getElementById('sutraBody');
    const meaningBody = document.getElementById('meaningBody');
    const wordBody    = document.getElementById('wordBody');

    // ---- build Panel A (full sutra) & Panel B (full meaning) as paragraphs of phrase-spans ----
    function marker(s) { return (s.n === "◈") ? "◈" : s.n; }

    function hoverSync(i, on) {
      [sutraBody, meaningBody].forEach(p => {
        const el = p.querySelector('.ph[data-i="' + i + '"]');
        if (el && !el.classList.contains('active')) el.classList.toggle('hl', on);
      });
    }

    SEG.forEach((s, i) => {
      const a = document.createElement('span');
      a.className = 'ph'; a.dataset.i = i;
      a.innerHTML = s.prakrit + '<sup>' + marker(s) + '</sup>';

      const b = document.createElement('span');
      b.className = 'ph'; b.dataset.i = i;   // meaning text filled by renderMeaningText()

      [a, b].forEach(el => {
        el.addEventListener('mouseenter', () => hoverSync(i, true));
        el.addEventListener('mouseleave', () => hoverSync(i, false));
        el.addEventListener('click', () => select(i));
      });

      sutraBody.appendChild(a);   sutraBody.appendChild(document.createTextNode(' '));
      meaningBody.appendChild(b); meaningBody.appendChild(document.createTextNode(' '));
    });

    function renderMeaningText() {
      meaningBody.querySelectorAll('.ph').forEach(el => {
        const s = SEG[+el.dataset.i];
        el.innerHTML = (lang === 'hi' ? s.hi : s.en) + '<sup>' + marker(s) + '</sup>';
      });
    }

    function renderWords() {
      const s = SEG[cur];
      wordBody.innerHTML = s.words.map(w => `
        <div class="word">
          <span class="w dev">${w.w}<small>${w.t}</small></span>
          <span class="m">${lang === 'hi' ? w.hi : w.en}</span>
        </div>`).join('');
    }

    function renderPic() {
      const s = SEG[cur];
      const img = document.getElementById('picImg');
      const ph  = document.getElementById('picPh');
      img.style.display = 'none'; ph.style.display = 'block';
      img.onload  = () => { img.style.display = 'block'; ph.style.display = 'none'; };
      img.onerror = () => { img.style.display = 'none';  ph.style.display = 'block'; };
      img.src = IMG_PREFIX + cur + '.png';
      document.getElementById('picCap').textContent = (lang === 'hi') ? s.capHi : s.capEn;
      document.getElementById('promptText').value = s.pic + " " + PIC_STYLE;
    }

    function select(i) {
      cur = i;
      [sutraBody, meaningBody].forEach(p => {
        p.querySelectorAll('.ph').forEach(el => {
          const on = (+el.dataset.i === i);
          el.classList.toggle('active', on);
          if (on) el.classList.remove('hl');
        });
      });
      const a = sutraBody.querySelector('.ph[data-i="' + i + '"]');
      const b = meaningBody.querySelector('.ph[data-i="' + i + '"]');
      if (a) a.scrollIntoView({ block: 'nearest' });
      if (b) b.scrollIntoView({ block: 'nearest' });
      renderWords();
      renderPic();
      document.getElementById('prevBtn').disabled = (i === 0);
      document.getElementById('nextBtn').disabled = (i === SEG.length - 1);
    }

    function setLang(l) {
      lang = l;
      document.querySelectorAll('#langToggle button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
      renderMeaningText(); renderWords(); renderPic();
    }

    // ---- events ----
    document.getElementById('langToggle').addEventListener('click', e => {
      const b = e.target.closest('button'); if (b) setLang(b.dataset.lang);
    });
    document.getElementById('prevBtn').addEventListener('click', () => { if (cur > 0) select(cur - 1); });
    document.getElementById('nextBtn').addEventListener('click', () => { if (cur < SEG.length - 1) select(cur + 1); });
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  document.getElementById('prevBtn').click();
      if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    });
    document.getElementById('promptBtn').addEventListener('click', () => {
      const box = document.getElementById('promptBox');
      const showing = box.style.display === 'block';
      box.style.display = showing ? 'none' : 'block';
      if (!showing) {
        const ta = document.getElementById('promptText');
        ta.focus(); ta.select();
        try { navigator.clipboard.writeText(ta.value); } catch (e) {}
      }
    });

    // ---- init ----
    renderMeaningText();
    select(0);
  </script>
</body>
</html>
